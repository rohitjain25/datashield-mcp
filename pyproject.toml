[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datashield-mcp"
version = "0.1.0"
description = "Local data cleaning, validation, deduplication, PII detection, and sanitization MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DataShield Contributors", email = "contributors@datashield.example"}
]
keywords = ["mcp", "data cleaning", "privacy", "pandas", "csv", "excel", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Data Scientists",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # Optional: pyarrow for parquet
    # "pyarrow>=12.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/datashield-mcp"
Documentation = "https://github.com/yourusername/datashield-mcp#readme"
Repository = "https://github.com/yourusername/datashield-mcp"
Issues = "https://github.com/yourusername/datashield-mcp/discussions"

[project.scripts]
datashield-mcp = "datashield_mcp.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools.packages]
find = {}